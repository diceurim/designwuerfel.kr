<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
  <title>WÜRFEL</title>
  <style>
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: none; background: #121212; }
    /* 브라우저 90% 확대/축소와 같은 화면으로 보여줍니다.
       작품 페이지(app.html)를 1/0.9배 크기로 띄운 뒤 0.9배로 줄여, 화면은 꽉 채우고 글자·요소 크기만 90%가 됩니다. */
    #viewer {
      position: fixed; top: 0; left: 0; display: block; border: 0;
      width: calc(100% / 0.9); height: calc(100% / 0.9);
      transform: scale(0.9); transform-origin: 0 0;
    }
  </style>
</head>
<body>
  <iframe id="viewer" src="app.html" title="WÜRFEL"></iframe>
  <script>
    // 처음부터 스페이스바로 주사위를 굴릴 수 있도록 작품 페이지에 키보드 초점을 넘깁니다.
    const viewer = document.getElementById('viewer');
    const focusViewer = () => viewer.contentWindow && viewer.contentWindow.focus();
    viewer.addEventListener('load', focusViewer);
    window.addEventListener('focus', focusViewer);
  </script>
</body>
</html>
